# standup-clipper ayarları. Tüm eşikler, modeller ve görünüm burada.

whisper:
  model: large-v3          # RTX 4060 (8 GB) için GPU'da large-v3
  device: cuda
  compute_type: float16
  fallback_model: medium   # GPU yüklenemezse CPU + int8 + medium
  fallback_compute_type: int8
  language: en
  # Noktalamalı örnek metin: Whisper'ın noktalama üretmesini ve kısa segmentler vermesini sağlar
  initial_prompt: "Hello, everyone. Thank you! So, I moved to America. It's great, right?"

laughter:
  backend: auto            # auto | jrgillick | yamnet  (auto: önce jrgillick, hata olursa yamnet)
  threshold: 0.4           # olasılık eşiği
  min_dur: 0.4             # bu süreden kısa kahkahalar atılır (sn)
  merge_gap: 0.6           # aradaki boşluk bundan kısaysa iki kahkaha birleşir (sn)
  stride: 1                # jrgillick: her N pencerede bir tahmin. GPU'da 1 (5 dk ses ~15 sn); CPU'da 4 önerilir

candidates:
  min_len: 20
  max_len: 90
  tail: 0.5                # kahkaha bitişinden sonra eklenecek süre
  top_n: 40
  consecutive_bonus: 1.0   # klip içindeki her ek kahkaha için bonus puan
  pause: 0.6               # kelimeler arası bundan uzun duraklama da cümle sınırı sayılır (sn)

select:
  per_minutes: 5           # her 5 dakikalık gösteriye en fazla 1 bit
  max_bits: 12             # üst sınır
  min_score: 6             # bu puanın altındaki bitler seçilmez
  context_before: 60       # Claude'a aday başlangıcından önce verilecek bağlam (sn)

gapfill:                   # seçilen bitlerde Whisper'ın atladığı konuşmayı VAD'sız yeniden dene
  min_gap: 2.0             # bundan uzun kelimesiz aralıklar yeniden transkribe edilir (sn)
  min_word_prob: 0.5       # sessizlikte uydurulan kelimeleri elemek için
  max_no_speech: 0.6

subs:
  font: Montserrat ExtraBold      # fonts/ klasöründen yüklenir
  fallback_font: Arial Black
  size: 64                  # 38 karakterlik satır ~860 px, güvenli alandaki 880 px'e sığar
  outline: 4
  primary: "&H00FFFFFF"     # beyaz (ASS: &HAABBGGRR)
  highlight: "&H0000FFFF"   # sarı karaoke vurgusu
  outline_color: "&H00000000"
  hook_size: 78
  hook_secs: 3
  credit_size: 36           # komedyen adı: üstte, hook'un hemen altında; hook bitince tek başına kalır
  credit_y: 470             # komedyen adının üst kenarı (px); hook bunun hemen üstünde, alttan hizalı
  credit_gap: -12           # hook kutusu ile komedyen adı arası (px); fontun iç boşluğu ~30 px eklediği için görünen boşluk ~18 px
  credit_color: "&H59FFFFFF" # yarı saydam beyaz (alfa 59 ≈ %65 opak)
  max_chars: 38
  max_lines: 2
  note_size: 58             # açıklama notu (ör. "CPR = kalp masajı"), güvenli bandın üstünde, altyazının üstünde
  note_secs: 2.5
  note_max_chars: 40
  below_video_gap: 30       # blur_bg: altyazının ortadaki videonun altından uzaklığı (px)

safe_zone:                  # Instagram/TikTok/Shorts arayüzünün kapatmadığı alan (1080x1920 üzerinde px)
  text_top: 1050            # altyazı ve notlar bu dikey bandın içinde kalır
  text_bottom: 1450         # altında kullanıcı adı / açıklama (alt ~%20)
  left: 60                  # yatay boşluklar
  right: 140                # sağda beğeni/yorum butonları (~%12)
  ui_bottom: 0.20           # arayüzün kapladığı alt oran (yalnız kontrol görseli için)
  ui_right: 0.12            # arayüzün kapladığı sağ oran (yalnız kontrol görseli için)

reframe:
  every_n: 5                # her 5 karede bir yüz tespiti
  smooth_window: 15         # hareketli ortalama penceresi (örnek sayısı)
  min_confidence: 0.5
  models: [blaze_face_short_range, blaze_face_full_range]   # sırayla denenir (full range: uzak/geniş çekim)
  max_face_y: 0.6           # yüz merkezi (pose'ta burun) karenin bu oranından aşağıdaysa seyirci sayılır
  pose_model: pose_landmarker_lite   # yüz bulunamazsa gövde merkezi (models/*.task); null = kapalı
  center_band: 0.4          # yüz kırpılan alanın yatayda orta %40'ında tutulur (çekim içi takip)
  hold_gap: 0.5             # bundan uzun yüzsüz aralıkta kamera son konumda bekler (sn)
  path_tol: 12              # takip yolu sadeleştirme toleransı (px)
  scene_threshold: 27       # PySceneDetect ContentDetector eşiği (düşük = daha çok kesme)
  min_shot: 1.0             # bundan kısa çekimler öncekiyle birleşir (sn)

render:
  layout: crop              # crop (yüz takipli 9:16 kırpma) | blur_bg (video ortada, bulanık arka plan)
  encoder: h264_nvenc       # yoksa otomatik libx264
  cq: 19                    # NVENC kalite (düşük = daha iyi)
  crf: 18                   # libx264 yedeği
  x264_preset: veryfast
  audio_filter: loudnorm=I=-14:TP=-1.5:LRA=11

upscale:                    # Real-ESRGAN (ncnn-vulkan), yalnız onaylanan klipler, yalnız crop düzeni
  mode: "off"               # off (telefonda fark görünmedi) | auto (kırpılan alan 1920'den kısaysa) | always
  model: realesr-general-x4v3
  tile: 0                   # 0 = otomatik; VRAM yetmezse 256/128 deneyin
  keep_frames: false        # work/{video}/frames/{n}/ altındaki ara kareleri sakla

review:
  port: 8765

claude:
  mode: cli                 # cli (abonelik, `claude -p`) | api (ANTHROPIC_API_KEY)
  model: claude-opus-5-5
  effort: high              # yalnız api modu
  max_retries: 2
  timeout: 600
  parallel: 4               # çeviri çağrıları aynı anda kaç tane
  price_in: 4.0             # $ / 1M girdi token (api modu maliyet logu)
  price_out: 20.0           # $ / 1M çıktı token
